# Builds the Mirror Mirror iOS app on a macOS runner, signs it with Xcode's cloud signing and uploads it to App Store Connect.
# No Mac, no Xcode login and no certificate files: it authenticates with an App Store Connect API key.
# Needs the same three repository secrets as mirrormirror-asc.yml (ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8). Cloud signing needs
# an Admin key. Order: run mirrormirror-asc.yml (preflight, register-bundle-id), create the app record in the App Store Connect
# website, then run this. Submission to App Review is a separate step; see mirrormirror/ios/PUBLISH.md.
name: Mirror Mirror - upload to App Store Connect

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number (CFBundleVersion). Leave empty to use the run number."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: mirrormirror-upload
  cancel-in-progress: false

jobs:
  archive-and-upload:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      PROJECT: mirrormirror/ios/MirrorMirror.xcodeproj
      SCHEME: MirrorMirror
      BUILD_NUMBER_INPUT: ${{ github.event.inputs.build_number }}
      RUN_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app && xcodebuild -version

      - name: Bundle the web app, vision library and face model
        run: bash mirrormirror/ios/prepare.sh

      - name: Install the App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then
              echo "Repository secret $name is not set. See the Cloud route in mirrormirror/ios/PUBLISH.md."
              exit 2
            fi
          done
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          if printf '%s' "$ASC_KEY_P8" | grep -q 'BEGIN'; then
            printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          else
            printf '%s' "$ASC_KEY_P8" | base64 --decode > "$KEY" 2>/dev/null || true
          fi
          chmod 600 "$KEY"
          if ! openssl pkey -in "$KEY" -noout 2>/dev/null; then
            echo "ASC_KEY_P8 is not a valid .p8 private key."
            exit 2
          fi
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Archive with cloud signing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          BUILD_NUMBER="${BUILD_NUMBER_INPUT:-$RUN_NUMBER}"
          xcodebuild archive \
            -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/MirrorMirror.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Export and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/MirrorMirror.xcarchive" \
            -exportOptionsPlist mirrormirror/ios/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded. The build shows under TestFlight in App Store Connect once it has processed."

      - name: Distribution logs (only if a step failed)
        if: failure()
        run: |
          for dir in "$TMPDIR"/*.xcdistributionlogs "$RUNNER_TEMP/export"; do
            [ -d "$dir" ] || continue
            for f in "$dir"/*.log; do
              [ -f "$f" ] || continue
              echo "=== $(basename "$f") (last 80 lines) ==="
              tail -n 80 "$f"
            done
          done
