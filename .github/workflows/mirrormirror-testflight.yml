# Builds the Mirror Mirror iOS app on a macOS runner and uploads it to App Store Connect (TestFlight).
# Run it by hand from the Actions tab once these repository secrets exist:
#   ASC_KEY_ID            App Store Connect API key id            (App Store Connect > Users and Access > Integrations > App Store Connect API)
#   ASC_ISSUER_ID         the issuer id shown on the same page
#   ASC_KEY_P8_BASE64     the downloaded AuthKey_XXXX.p8, base64-encoded   (base64 -i AuthKey_XXXX.p8 | pbcopy)
#   APPLE_TEAM_ID         your 10-character team id
#   IOS_DIST_P12_BASE64   an Apple Distribution certificate exported from Keychain Access as .p12, base64-encoded
#   IOS_DIST_P12_PASSWORD the password you gave that .p12
# Submission to App Review itself is done in App Store Connect after the build has processed (see mirrormirror/ios/PUBLISH.md).
name: Mirror Mirror - upload to TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number (CFBundleVersion). Leave empty to use the run number."
        required: false
        default: ""

jobs:
  archive-and-upload:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      PROJECT: mirrormirror/ios/MirrorMirror.xcodeproj
      SCHEME: MirrorMirror
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app && xcodebuild -version

      - name: Bundle the web app, vision library and face model
        run: bash mirrormirror/ios/prepare.sh

      - name: Install the App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          echo "ASC_KEY_PATH=$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Install the distribution certificate in a temporary keychain
        env:
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$IOS_DIST_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$IOS_DIST_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          BUILD_NUMBER="${{ github.event.inputs.build_number }}"
          if [ -z "$BUILD_NUMBER" ]; then BUILD_NUMBER="${{ github.run_number }}"; fi
          xcodebuild archive \
            -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/MirrorMirror.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Export and upload to App Store Connect
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" mirrormirror/ios/ExportOptions.plist || true
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/MirrorMirror.xcarchive" \
            -exportOptionsPlist mirrormirror/ios/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded. Watch App Store Connect > TestFlight for processing."
