[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "driverescue"
version = "0.1.0"
description = "Read-only-first toolkit for rescuing data from old or failing drives"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
driverescue = "driverescue.cli:main"

[tool.setuptools]
packages = ["driverescue"]
